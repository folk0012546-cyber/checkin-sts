<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>เช็คขึ้นเครื่อง STS</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#0f1720;--card:#1b2733;--card2:#22303d;--line:#2f4152;--txt:#eaf2f8;--mut:#8ea3b5;
--green:#22c55e;--greenbg:#123a24;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--vip:#a855f7;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--txt);
padding-bottom:40px;font-size:16px}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f1720,#0f1720ee);
backdrop-filter:blur(6px);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htop h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.who{font-size:12px;color:var(--mut);background:var(--card);padding:5px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.who b{color:var(--txt)}
.counter{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat .n{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:11px;color:var(--mut);margin-top:3px}
.stat.done .n{color:var(--green)} .stat.left .n{color:var(--amber)}
.bar{height:8px;background:var(--card);border-radius:6px;overflow:hidden;margin-top:9px;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:0;transition:width .3s}
.search{width:100%;margin-top:9px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
background:var(--card);color:var(--txt);font-size:16px}
.search::placeholder{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);
color:var(--mut);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on.st{background:var(--green);border-color:var(--green)}
select.sel{margin:8px 12px 0;width:calc(100% - 24px);padding:10px 12px;border-radius:12px;border:1px solid var(--line);
background:var(--card);color:var(--txt);font-size:15px}
.gh{padding:16px 14px 6px;font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;
display:flex;justify-content:space-between;align-items:center}
.gh span.c{color:var(--txt);background:var(--card);padding:2px 10px;border-radius:12px;font-size:12px}
.list{padding:0 12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;transition:background .12s,border-color .12s;user-select:none}
.row:active{background:var(--card2)}
.row.done{background:var(--greenbg);border-color:#1c6b3a}
.no{flex:0 0 34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--mut)}
.row.done .no{background:#16532f;border-color:#1c6b3a;color:#bbf7d0}
.info{flex:1;min-width:0}
.nm{font-size:16px;font-weight:700;line-height:1.25;word-break:break-word}
.sub{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.badge.vip{background:#3b1d52;border-color:#6b3fa0;color:#e9d5ff}
.badge.yes{background:#0e2f4a;border-color:#1e5a8a;color:#bfdbfe}
.badge.no{background:#3a2410;border-color:#7a4a1a;color:#fed7aa}
.tick{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;
justify-content:center;font-size:18px;color:transparent}
.row.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.doneby{font-size:11px;color:#7dd3a0;margin-top:4px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.cancelsec{margin:14px 12px 0}
.cancelhd{font-size:13px;font-weight:700;color:var(--red);padding:8px 4px;display:flex;justify-content:space-between}
.row.cx{opacity:.55;background:var(--card);border-style:dashed}
.row.cx .nm{text-decoration:line-through}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0f1720ee;backdrop-filter:blur(6px);
border-top:1px solid var(--line);padding:8px 12px;display:none}
.footbar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.footbar button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);
color:var(--txt);font-size:14px;font-weight:700}
.online{font-size:11px;color:var(--green);margin-top:6px;text-align:center}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:360px;width:100%}
.box h3{font-size:18px;margin-bottom:6px} .box p{color:var(--mut);font-size:13px;margin-bottom:14px}
.box input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
color:var(--txt);font-size:16px;margin-bottom:14px}
.box .b2{display:flex;gap:8px}
.box button{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:700}
.bp{background:var(--blue);color:#fff} .bs{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.bd{background:var(--red);color:#fff}
.gear{background:none;border:none;color:var(--mut);font-size:20px;padding:2px 6px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="htop">
    <h1>✈️ เช็คขึ้นเครื่อง</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="who" id="who" onclick="askName()">👤 <b id="whoName">-</b></span>
      <button class="gear" onclick="openMenu()">⚙️</button>
    </div>
  </div>
  <div class="counter">
    <div class="stat done"><div class="n" id="cDone">0</div><div class="l">ขึ้นแล้ว</div></div>
    <div class="stat left"><div class="n" id="cLeft">0</div><div class="l">ยังไม่ขึ้น</div></div>
    <div class="stat"><div class="n" id="cTot">0</div><div class="l">ทั้งหมด</div></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <input class="search" id="q" placeholder="🔍 ค้นชื่อ / ชื่อเล่น / เลข" oninput="render()">
  <div class="chips" id="stChips">
    <div class="chip st on" data-st="all" onclick="setSt(this,'all')">ทั้งหมด</div>
    <div class="chip st" data-st="left" onclick="setSt(this,'left')">ยังไม่ขึ้น</div>
    <div class="chip st" data-st="done" onclick="setSt(this,'done')">ขึ้นแล้ว</div>
  </div>
  <div class="chips" id="grChips">
    <div class="chip on" data-gr="all" onclick="setGr(this,'all')">ทุกกลุ่ม</div>
    <div class="chip" data-gr="Customer" onclick="setGr(this,'Customer')">ลูกค้า</div>
    <div class="chip" data-gr="Special" onclick="setGr(this,'Special')">ลูกค้าพิเศษ</div>
    <div class="chip" data-gr="Team" onclick="setGr(this,'Team')">ทีม STS</div>
  </div>
  <select class="sel" id="course" onchange="render()"><option value="">— ทุกสนามกอล์ฟ —</option></select>
  <div class="online" id="online"></div>
</header>

<div class="list" id="list"></div>
<div class="cancelsec" id="cancelSec"></div>
</div>

<div class="footbar" id="footbar"><div class="in">
  <button onclick="scrollTop()">⬆️ บนสุด</button>
  <button onclick="setSt(document.querySelector('[data-st=left]'),'left')">🔎 เหลือใครบ้าง</button>
</div></div>

const csel=document.getElementById('course');
courses.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;csel.appendChild(o)});

function banner(){document.getElementById('online').innerHTML='⚠️ ต่อ Firebase ไม่ได้ — โหมดออฟไลน์ (เครื่องนี้เท่านั้น ไม่ sync)';document.getElementById('online').style.color='var(--amber)';}
function presence(){
  if(OFFLINE||!myName||!db)return;
  const ref=db.ref('rooms/'+ROOM+'/online/'+myId);
  ref.set({name:myName,at:Date.now()});ref.onDisconnect().remove();
}
if(!OFFLINE&&db){
  db.ref('rooms/'+ROOM+'/status').on('value',s=>{status=s.val()||{};render()});
  db.ref('rooms/'+ROOM+'/online').on('value',s=>{
    const v=s.val()||{};const now=Date.now();
    const names=Object.values(v).filter(u=>now-(u.at||0)<120000).map(u=>u.name);
    document.getElementById('online').textContent=names.length?('🟢 ออนไลน์: '+names.join(', ')):'';
  });
  setInterval(presence,60000);
}

function fmtT(ts){const d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function tk(p){return p.ticket==='Yes'?'<span class="badge yes">มีตั๋ว</span>':p.ticket==='No'?'<span class="badge no">ไม่มีตั๋ว</span>':''}

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const cf=document.getElementById('course').value;
  const done=active.filter(p=>status[p.no]&&status[p.no].boarded).length;
  document.getElementById('cDone').textContent=done;
  document.getElementById('cLeft').textContent=active.length-done;
  document.getElementById('cTot').textContent=active.length;
  document.getElementById('bar').style.width=(active.length?done/active.length*100:0)+'%';

  let items=active.filter(p=>{
    if(fGr!=='all'&&p.group!==fGr)return false;
    if(cf&&p.course!==cf)return false;
    const isDone=!!(status[p.no]&&status[p.no].boarded);
    if(fSt==='done'&&!isDone)return false;
    if(fSt==='left'&&isDone)return false;
    if(q){const hay=(p.name+' '+p.nick+' '+p.no+' '+p.course).toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const groups=fGr==='all'?['Customer','Special','Team']:[fGr];
  let html='';
  groups.forEach(g=>{
    const gi=items.filter(p=>p.group===g);
    if(!gi.length)return;
    const gd=gi.filter(p=>status[p.no]&&status[p.no].boarded).length;
    html+='<div class="gh">'+(g==='Customer'?'ลูกค้า':g==='Special'?'ลูกค้าพิเศษ':'ทีม STS')+' <span class="c">'+gd+'/'+gi.length+'</span></div>';
    gi.forEach(p=>html+=rowHtml(p));
  });
  document.getElementById('list').innerHTML=html||'<div class="empty">— ไม่พบรายชื่อตามที่กรอง —</div>';

  // cancelled section
  if(cancelled.length){
    let ch='<div class="cancelhd">🚫 ยกเลิก/ไม่มา ('+cancelled.length+') <span onclick="toggleCx()" style="color:var(--mut)">แสดง/ซ่อน</span></div>';
    ch+='<div id="cxList" style="display:'+(cxOpen?'block':'none')+'">'+cancelled.map(p=>rowHtml(p,true)).join('')+'</div>';
    document.getElementById('cancelSec').innerHTML=ch;
  }
}
let cxOpen=false;
function toggleCx(){cxOpen=!cxOpen;render()}
function rowHtml(p,cx){
  const s=status[p.no]||{};const isDone=!!s.boarded;
  const cls='row'+(cx?' cx':(isDone?' done':''));
  const by=isDone&&!cx?'<div class="doneby">✓ '+(s.by||'')+' • '+fmtT(s.at)+'</div>':'';
  return '<div class="'+cls+'" '+(cx?'':'onclick="toggle('+p.no+')"')+'>'
    +'<div class="no">'+p.no+'</div>'
    +'<div class="info"><div class="nm">'+esc(p.name)+(p.nick?' <span style="color:var(--mut);font-weight:500">('+esc(p.nick)+')</span>':'')+'</div>'
    +'<div class="sub">'+(p.course?'<span>📍'+esc(p.course)+'</span>':'')+tk(p)+'</div>'+by+'</div>'
    +(cx?'':'<div class="tick">✓</div>')+'</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function saveLocal(){try{localStorage.setItem('checkinStatus_'+ROOM,JSON.stringify(status))}catch(_){}}
function toggle(no){
  if(!myName){askName();return}
  const cur=status[no]&&status[no].boarded;
  if(cur){
    if(!confirm('ยกเลิกเช็คอินของคนนี้?'))return;
    if(OFFLINE){delete status[no];saveLocal();render()}else{db.ref('rooms/'+ROOM+'/status/'+no).remove()}
  }else{
    const rec={boarded:true,by:myName,at:Date.now()};
    if(OFFLINE){status[no]=rec;saveLocal();render()}else{db.ref('rooms/'+ROOM+'/status/'+no).set(rec)}
    if(navigator.vibrate)navigator.vibrate(30);
  }
}
function setSt(el,v){fSt=v;document.querySelectorAll('#stChips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();scrollTop()}
function setGr(el,v){fGr=v;document.querySelectorAll('#grChips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render()}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('scroll',()=>{document.getElementById('footbar').style.display=window.scrollY>300?'block':'none'});

function askName(){
  document.getElementById('nameInput').value=myName;
  document.getElementById('nameModal').style.display='flex';
  setTimeout(()=>document.getElementById('nameInput').focus(),100);
}
function saveName(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v)return;
  myName=v;localStorage.setItem('checkinName',v);
  document.getElementById('whoName').textContent=v;
  document.getElementById('nameModal').style.display='none';
  presence();
}
function openMenu(){
  const done=active.filter(p=>status[p.no]&&status[p.no].boarded).length;
  const msg='เมนู\n\nขึ้นแล้ว '+done+'/'+active.length+' คน\n\nกด OK = ล้างสถานะเช็คอินทั้งหมด (เริ่มเช็ครอบใหม่)\nกด Cancel = ปิด';
  if(confirm(msg)){
    if(confirm('ยืนยัน! จะล้างการเช็คอินของทุกคนออกทั้งหมด ใช้ตอนเริ่มเที่ยวบินใหม่เท่านั้น')){
      if(OFFLINE){status={};saveLocal();render()}else{db.ref('rooms/'+ROOM+'/status').remove()}
    }
  }
}
if(myName){document.getElementById('whoName').textContent=myName;presence()}else{setTimeout(askName,300)}
render();
</script>

<div class="modal" id="nameModal" style="display:none">
  <div class="box">
    <h3>ใส่ชื่อผู้เช็ค</h3>
    <p>ชื่อจะแสดงว่าใครเป็นคนเช็คแต่ละคน (เพื่อนร่วมงานเห็นแบบ real-time)</p>
    <input id="nameInput" placeholder="เช่น โฟล์ค, เฟิร์น" onkeydown="if(event.key==='Enter')saveName()">
    <div class="b2"><button class="bp" onclick="saveName()">บันทึก</button></div>
  </div>
</div>
</body>
</html>
